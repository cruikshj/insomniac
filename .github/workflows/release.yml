name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore Insomniac/Insomniac.csproj
      
    - name: Publish single-file executable
      run: |
        dotnet publish Insomniac/Insomniac.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishTrimmed=true `
          -p:EnableCompressionInSingleFile=true `
          -o publish
      
    - name: Get version from tag
      id: get_version
      run: |
        if ("${{ github.event_name }}" -eq "release") {
          $version = "${{ github.event.release.tag_name }}"
        } else {
          $version = "dev-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
      
    - name: Create artifact
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        Compress-Archive -Path publish/Insomniac.exe -DestinationPath "Insomniac-$version-win-x64.zip"
      shell: pwsh
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: insomniac-windows
        path: Insomniac-*.zip
        
    - name: Attach to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: Insomniac-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
